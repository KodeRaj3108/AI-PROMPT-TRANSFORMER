<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#4338ca"/>
    </linearGradient>
    <filter id="iconGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#iconBg)"/>

  <!-- Lightning bolt (transform symbol) -->
  <polygon points="36,8 22,34 33,34 28,56 46,28 34,28 40,8" fill="white" opacity="0.97" filter="url(#iconGlow)"/>

  <!-- 5 tiny model indicator dots at the bottom -->
  <circle cx="14" cy="57" r="2.5" fill="#34d399"/>
  <circle cx="21" cy="57" r="2.5" fill="#f59e0b"/>
  <circle cx="28" cy="57" r="2.5" fill="#60a5fa"/>
  <circle cx="35" cy="57" r="2.5" fill="#f87171"/>
  <circle cx="42" cy="57" r="2.5" fill="#c4b5fd"/>
</svg>
