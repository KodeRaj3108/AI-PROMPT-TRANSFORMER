<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6d28d9"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon badge -->
  <rect x="8" y="16" width="88" height="88" rx="20" fill="url(#bgGrad)"/>

  <!-- Lightning bolt inside badge -->
  <polygon points="52,30 36,62 50,62 44,90 68,54 53,54 62,30" fill="white" opacity="0.95" filter="url(#glow)"/>

  <!-- Small model dots (5 colored dots hinting at 5 AI models) -->
  <circle cx="22" cy="98" r="4" fill="#34d399"/>
  <circle cx="34" cy="98" r="4" fill="#f59e0b"/>
  <circle cx="46" cy="98" r="4" fill="#60a5fa"/>
  <circle cx="58" cy="98" r="4" fill="#f87171"/>
  <circle cx="70" cy="98" r="4" fill="#a78bfa"/>

  <!-- Wordmark -->
  <text x="112" y="58" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="url(#arrowGrad)" letter-spacing="-0.5">AI Prompt</text>
  <text x="112" y="90" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="url(#arrowGrad)" letter-spacing="-0.5">Transformer</text>

  <!-- Tagline -->
  <text x="113" y="108" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8" letter-spacing="0.5">rough idea → 5 model-tuned prompts</text>
</svg>
